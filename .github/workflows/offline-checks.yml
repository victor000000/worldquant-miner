name: Offline Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Syntax and mocked regressions (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check all tracked Python source syntax without imports
        run: python ci/check_python_syntax.py
      - name: Install only offline test dependencies
        run: python -m pip install -r ci/requirements.txt
      - name: Validate installed dependency compatibility
        run: python -m pip check
      - name: Run synthetic regression tests without network or hardware
        run: python -m unittest discover -s ci/tests -v
